<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operación + Tecnología | Una iniciativa para parques solares</title>
  <meta name="description" content="El conocimiento operativo de Robin Fernando y la capacidad tecnológica de Leonardo Caraque pueden combinarse para desarrollar mejoras concretas en los parques." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="./favicon.png" type="image/png" />
  <link rel="shortcut icon" href="./favicon.png" type="image/png" />
  <link rel="manifest" href="./manifest.json" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    (async () => {
      try {
        const manifest = await fetch('./vinext-client-entry-manifest.json').then(r => r.json());
        const script = document.createElement('script');
        script.type = 'module';
        script.src = './' + manifest.appBrowserEntry;
        document.body.appendChild(script);
      } catch (e) {
        console.error('Failed to load app:', e);
        document.body.innerHTML = '<p>Error loading application</p>';
      }
    })();
  </script>
</body>
</html>
